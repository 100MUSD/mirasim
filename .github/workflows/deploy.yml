name: build-and-deploy-wiki

on:
  push:
    branches: [main]
  schedule:
    # 每 30 分钟抓取一次官网最新版本与资讯并重新部署（避开整点减少排队延迟）
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 抓取失败（官网瞬时不可用/结构变化）时退回仓库中已提交的数据，保证页面始终可部署
      - name: Fetch latest data from mirasim.ai
        run: node scripts/fetch-data.mjs || echo "::warning::抓取官网数据失败，使用仓库内已有数据构建"

      - name: Build 14 locales
        run: node scripts/build.mjs

      # OG 卡片与图标需要 headless Chrome 渲染；runner 自带 Chrome，
      # 但默认字体不覆盖中日韩与泰文，缺字体会渲染成豆腐块
      - name: Install CJK and Thai fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            fonts-noto-cjk fonts-noto-core fonts-noto-unhinted
          fc-cache -f

      - name: Generate icons and OG cards
        run: node scripts/make-assets.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # 抽查非拉丁语系 OG 卡片，便于确认字体渲染正常
      - name: Upload OG cards for inspection
        uses: actions/upload-artifact@v4
        with:
          name: og-sample
          path: |
            dist/assets/og-zh.png
            dist/assets/og-ja.png
            dist/assets/og-th.png
            dist/assets/og-ru.png
          retention-days: 3
          if-no-files-found: error

      # SEO / hreflang / JSON-LD / 资源引用自检，不通过则中止部署
      - name: Verify build
        run: node scripts/check.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
