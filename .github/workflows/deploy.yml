name: build-and-deploy-wiki

on:
  push:
    branches: [main]
  schedule:
    # 每 30 分钟抓取一次官网最新版本与资讯（避开整点减少排队延迟）
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # 数据有变化时把 site-data.json 提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 抓取失败（官网瞬时不可用/结构变化）时退回仓库中已提交的数据，保证页面始终可部署
      - name: Fetch latest data from mirasim.ai
        id: fetch
        run: |
          if node scripts/fetch-data.mjs | tee /tmp/fetch.log; then
            grep -q CHANGED /tmp/fetch.log && echo "changed=true" >> "$GITHUB_OUTPUT" || true
          else
            echo "::warning::抓取官网数据失败，使用仓库内已有数据构建"
          fi

      # 回写数据顺带触发 Vercel 的 git 部署，两个托管平台都能拿到最新内容
      - name: Commit refreshed data
        if: steps.fetch.outputs.changed == 'true' && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json
          git diff --staged --quiet || git commit -m "chore: 同步官网最新版本与资讯 [skip ci]"
          git push

      # 图标与 OG 卡片是入库的静态产物，构建阶段只复制，无需 Chrome
      - name: Build 14 locales
        run: node scripts/build.mjs

      # SEO / hreflang / JSON-LD / 资源引用自检，不通过则中止部署
      - name: Verify build
        run: node scripts/check.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
